<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Barby 💛</title>
    <link rel="stylesheet" href="mibarbie.css">
</head>
<body>
    <div id="container">
        <div id="main-text" class="barby-text">barby</div>
        <div id="lily-container">
            <svg id="lily-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <radialGradient id="petal-grad" cx="50%" cy="80%" r="80%" fx="50%" fy="80%">
                  <stop offset="0%" stop-color="#FF9800"/>
                  <stop offset="40%" stop-color="#FFEB3B"/>
                  <stop offset="100%" stop-color="#FFF59D"/>
                </radialGradient>
                <path id="petal" d="M100 100 C70 40 90 10 100 0 C110 10 130 40 100 100" fill="url(#petal-grad)"/>
                <path id="petal-wide" d="M100 100 C60 40 70 10 100 0 C130 10 140 40 100 100" fill="url(#petal-grad)"/>
              </defs>
              
              <g transform="translate(0, 10)">
                  <use href="#petal-wide" transform="rotate(0, 100, 100)" />
                  <use href="#petal" transform="rotate(60, 100, 100)" />
                  <use href="#petal-wide" transform="rotate(120, 100, 100)" />
                  <use href="#petal" transform="rotate(180, 100, 100)" />
                  <use href="#petal-wide" transform="rotate(240, 100, 100)" />
                  <use href="#petal" transform="rotate(300, 100, 100)" />
                  
                  <line x1="100" y1="100" x2="90" y2="60" stroke="#8BC34A" stroke-width="2"/>
                  <ellipse cx="90" cy="60" rx="3" ry="5" fill="#5D4037" transform="rotate(20 90 60)"/>
                  
                  <line x1="100" y1="100" x2="110" y2="60" stroke="#8BC34A" stroke-width="2"/>
                  <ellipse cx="110" cy="60" rx="3" ry="5" fill="#5D4037" transform="rotate(-20 110 60)"/>
                  
                  <line x1="100" y1="100" x2="70" y2="75" stroke="#8BC34A" stroke-width="2"/>
                  <ellipse cx="70" cy="75" rx="3" ry="5" fill="#5D4037" transform="rotate(60 70 75)"/>
                  
                  <line x1="100" y1="100" x2="130" y2="75" stroke="#8BC34A" stroke-width="2"/>
                  <ellipse cx="130" cy="75" rx="3" ry="5" fill="#5D4037" transform="rotate(-60 130 75)"/>
                  
                  <line x1="100" y1="100" x2="85" y2="40" stroke="#8BC34A" stroke-width="2"/>
                  <ellipse cx="85" cy="40" rx="3" ry="5" fill="#5D4037" transform="rotate(10 85 40)"/>
                  
                  <line x1="100" y1="100" x2="115" y2="40" stroke="#8BC34A" stroke-width="2"/>
                  <ellipse cx="115" cy="40" rx="3" ry="5" fill="#5D4037" transform="rotate(-10 115 40)"/>

                  <line x1="100" y1="100" x2="100" y2="45" stroke="#4CAF50" stroke-width="3"/>
                  <circle cx="100" cy="45" r="4" fill="#8BC34A"/>
              </g>
            </svg>
            <div class="message">Para ti, Barby 💛</div>
        </div>
    </div>
    
    <script src="mibarbie.js"></script>
</body>
</html>
