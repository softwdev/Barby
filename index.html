<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Barby 💛</title>
    <link rel="stylesheet" href="mibarbie.css">
</head>
<body>
    <div id="container">
        <div id="main-text" class="barby-text">barby</div>
        <div id="lily-container">
            <svg id="lily-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <radialGradient id="petal-grad" cx="50%" cy="100%" r="100%" fx="50%" fy="100%">
                  <stop offset="0%" stop-color="#8BC34A"/>
                  <stop offset="25%" stop-color="#FFC107"/>
                  <stop offset="60%" stop-color="#FFEB3B"/>
                  <stop offset="100%" stop-color="#FFF59D"/>
                </radialGradient>
                
                <pattern id="spots" width="20" height="20" patternUnits="userSpaceOnUse">
                   <circle cx="10" cy="10" r="1.5" fill="#D84315" opacity="0.6"/>
                   <circle cx="4" cy="15" r="1" fill="#D84315" opacity="0.5"/>
                   <circle cx="16" cy="5" r="1.2" fill="#D84315" opacity="0.7"/>
                </pattern>

                <path id="petal-outer" d="M100,100 C80,75 70,30 100,5 C130,30 120,75 100,100" fill="url(#petal-grad)"/>
                <path id="petal-inner" d="M100,100 C88,70 78,25 100,0 C122,25 112,70 100,100" fill="url(#petal-grad)"/>
                
                <path id="petal-outer-spots" d="M100,100 C80,75 70,30 100,5 C130,30 120,75 100,100" fill="url(#spots)"/>
                <path id="petal-inner-spots" d="M100,100 C88,70 78,25 100,0 C122,25 112,70 100,100" fill="url(#spots)"/>

                <g id="full-outer-petal">
                    <use href="#petal-outer" />
                    <path d="M100,100 Q100,50 100,5" stroke="#FBC02D" fill="none" stroke-width="1.5" opacity="0.6"/>
                    <mask id="spot-mask-outer">
                        <circle cx="100" cy="80" r="30" fill="white"/>
                    </mask>
                    <use href="#petal-outer-spots" mask="url(#spot-mask-outer)" />
                </g>

                <g id="full-inner-petal">
                    <use href="#petal-inner" />
                    <path d="M100,100 Q100,50 100,0" stroke="#FBC02D" fill="none" stroke-width="1.5" opacity="0.6"/>
                    <mask id="spot-mask-inner">
                        <circle cx="100" cy="75" r="25" fill="white"/>
                    </mask>
                    <use href="#petal-inner-spots" mask="url(#spot-mask-inner)" />
                </g>
              </defs>
              
              <g transform="translate(0, 10)">
                  <use href="#full-outer-petal" transform="rotate(0, 100, 100)" />
                  <use href="#full-outer-petal" transform="rotate(120, 100, 100)" />
                  <use href="#full-outer-petal" transform="rotate(240, 100, 100)" />
                  
                  <use href="#full-inner-petal" transform="rotate(60, 100, 100)" />
                  <use href="#full-inner-petal" transform="rotate(180, 100, 100)" />
                  <use href="#full-inner-petal" transform="rotate(300, 100, 100)" />
                  
                  <path d="M100,100 Q90,70 85,45" stroke="#DCE775" fill="none" stroke-width="1.5"/>
                  <ellipse cx="85" cy="45" rx="2.5" ry="7" fill="#E65100" transform="rotate(-15 85 45)"/>
                  
                  <path d="M100,100 Q110,70 115,45" stroke="#DCE775" fill="none" stroke-width="1.5"/>
                  <ellipse cx="115" cy="45" rx="2.5" ry="7" fill="#E65100" transform="rotate(15 115 45)"/>
                  
                  <path d="M100,100 Q75,90 45,85" stroke="#DCE775" fill="none" stroke-width="1.5"/>
                  <ellipse cx="45" cy="85" rx="7" ry="2.5" fill="#E65100" transform="rotate(-15 45 85)"/>
                  
                  <path d="M100,100 Q125,90 155,85" stroke="#DCE775" fill="none" stroke-width="1.5"/>
                  <ellipse cx="155" cy="85" rx="7" ry="2.5" fill="#E65100" transform="rotate(15 155 85)"/>
                  
                  <path d="M100,100 Q80,120 70,145" stroke="#DCE775" fill="none" stroke-width="1.5"/>
                  <ellipse cx="70" cy="145" rx="2.5" ry="7" fill="#E65100" transform="rotate(-30 70 145)"/>
                  
                  <path d="M100,100 Q120,120 130,145" stroke="#DCE775" fill="none" stroke-width="1.5"/>
                  <ellipse cx="130" cy="145" rx="2.5" ry="7" fill="#E65100" transform="rotate(30 130 145)"/>

                  <path d="M100,100 Q105,70 100,40" stroke="#8BC34A" fill="none" stroke-width="3"/>
                  <circle cx="97" cy="38" r="2.5" fill="#558B2F"/>
                  <circle cx="103" cy="38" r="2.5" fill="#558B2F"/>
                  <circle cx="100" cy="36" r="2.5" fill="#558B2F"/>
              </g>
            </svg>
            <div class="message">Para ti, Barby 💛</div>
        </div>
    </div>
    
    <script src="mibarbie.js"></script>
</body>
</html>
