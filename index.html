<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Barby 💛</title>
    <link rel="stylesheet" href="mibarbie.css">
</head>
<body>
    <div id="container">
        <div id="main-text" class="barby-text">barby</div>
        <div id="lily-container">
            <svg id="lily-svg" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <filter id="blur">
                    <feGaussianBlur stdDeviation="3"/>
                </filter>
                
                <linearGradient id="leaf-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#8BC34A"/>
                    <stop offset="100%" stop-color="#2E7D32"/>
                </linearGradient>

                <radialGradient id="petal-back" cx="50%" cy="90%" r="100%">
                    <stop offset="0%" stop-color="#FF8F00"/>
                    <stop offset="40%" stop-color="#FFC107"/>
                    <stop offset="100%" stop-color="#FFEB3B"/>
                </radialGradient>

                <radialGradient id="petal-front" cx="50%" cy="10%" r="100%">
                    <stop offset="0%" stop-color="#FF8F00"/>
                    <stop offset="30%" stop-color="#FFC107"/>
                    <stop offset="70%" stop-color="#FFEB3B"/>
                    <stop offset="100%" stop-color="#FFF59D"/>
                </radialGradient>
                
                <radialGradient id="bud-grad" cx="20%" cy="20%" r="80%">
                    <stop offset="0%" stop-color="#DCE775"/>
                    <stop offset="50%" stop-color="#FFF176"/>
                    <stop offset="100%" stop-color="#8BC34A"/>
                </radialGradient>

                <path id="front-petal" d="M -15,0 C -55,40 -35,110 0,140 C 35,110 55,40 15,0 C 10,15 -10,15 -15,0 Z" fill="url(#petal-front)"/>
                <path id="front-petal-vein" d="M 0,0 Q 0,70 0,130" stroke="#FBC02D" stroke-width="1.5" fill="none" opacity="0.6"/>

                <path id="back-petal" d="M -12,0 C -45,-40 -25,-100 0,-130 C 25,-100 45,-40 12,0 Z" fill="url(#petal-back)"/>
                <path id="back-petal-vein" d="M 0,0 Q 0,-60 0,-120" stroke="#F57F17" stroke-width="1.5" fill="none" opacity="0.5"/>
                
                <g id="spots-group" opacity="0.6">
                    <circle cx="-15" cy="-5" r="1.5" fill="#BF360C"/>
                    <circle cx="-25" cy="10" r="1" fill="#BF360C"/>
                    <circle cx="-10" cy="15" r="1.5" fill="#BF360C"/>
                    <circle cx="-35" cy="0" r="1.2" fill="#BF360C"/>
                    
                    <circle cx="15" cy="-5" r="1.5" fill="#BF360C"/>
                    <circle cx="25" cy="10" r="1" fill="#BF360C"/>
                    <circle cx="10" cy="15" r="1.5" fill="#BF360C"/>
                    <circle cx="35" cy="0" r="1.2" fill="#BF360C"/>
                    
                    <circle cx="0" cy="15" r="1.5" fill="#BF360C"/>
                    <circle cx="-5" cy="25" r="1" fill="#BF360C"/>
                    <circle cx="5" cy="25" r="1.2" fill="#BF360C"/>
                    <circle cx="0" cy="35" r="1" fill="#BF360C"/>
                </g>

                <g id="stamens-angled">
                    <path d="M 0,15 Q -25,-15 -45,-30" stroke="#DCE775" stroke-width="2.5" fill="none"/>
                    <ellipse cx="-45" cy="-30" rx="3.5" ry="10" fill="#3E2723" transform="rotate(45 -45 -30)"/>
                    
                    <path d="M 0,15 Q -10,-35 -15,-60" stroke="#DCE775" stroke-width="2.5" fill="none"/>
                    <ellipse cx="-15" cy="-60" rx="3.5" ry="10" fill="#3E2723" transform="rotate(15 -15 -60)"/>
                    
                    <path d="M 0,15 Q 15,-35 25,-55" stroke="#DCE775" stroke-width="2.5" fill="none"/>
                    <ellipse cx="25" cy="-55" rx="3.5" ry="10" fill="#3E2723" transform="rotate(-20 25 -55)"/>
                    
                    <path d="M 0,15 Q 35,-15 55,-25" stroke="#DCE775" stroke-width="2.5" fill="none"/>
                    <ellipse cx="55" cy="-25" rx="3.5" ry="10" fill="#3E2723" transform="rotate(-45 55 -25)"/>
                    
                    <path d="M 0,15 Q -40,10 -60,0" stroke="#DCE775" stroke-width="2.5" fill="none"/>
                    <ellipse cx="-60" cy="0" rx="3.5" ry="10" fill="#3E2723" transform="rotate(70 -60 0)"/>
                    
                    <path d="M 0,15 Q 40,10 60,-5" stroke="#DCE775" stroke-width="2.5" fill="none"/>
                    <ellipse cx="60" cy="-5" rx="3.5" ry="10" fill="#3E2723" transform="rotate(-65 60 -5)"/>

                    <path d="M 0,15 Q 0,-30 5,-75" stroke="#8BC34A" stroke-width="4" fill="none"/>
                    <path d="M 0,-76 Q 5,-82 10,-76" stroke="#558B2F" stroke-width="5" fill="none" stroke-linecap="round"/>
                </g>

                <g id="lily-angled">
                    <use href="#back-petal" transform="rotate(-55)" />
                    <use href="#back-petal-vein" transform="rotate(-55)" />
                    
                    <use href="#back-petal" transform="rotate(0)" />
                    <use href="#back-petal-vein" transform="rotate(0)" />
                    
                    <use href="#back-petal" transform="rotate(55)" />
                    <use href="#back-petal-vein" transform="rotate(55)" />
                    
                    <ellipse cx="0" cy="5" rx="18" ry="12" fill="#E65100" opacity="0.6" filter="url(#blur)"/>
                    <use href="#spots-group" transform="translate(0, -10) scale(0.8)"/>
                    
                    <use href="#stamens-angled"/>
                    
                    <use href="#front-petal" transform="rotate(65)" />
                    <use href="#front-petal-vein" transform="rotate(65)" />
                    
                    <use href="#front-petal" transform="rotate(-65)" />
                    <use href="#front-petal-vein" transform="rotate(-65)" />
                    
                    <use href="#front-petal" transform="rotate(0)" />
                    <use href="#front-petal-vein" transform="rotate(0)" />
                    
                    <use href="#spots-group" transform="translate(0, 15) scale(0.9)"/>
                    <path d="M -15,10 C 0,30 15,10 0,25 Z" fill="#FFB300" filter="url(#blur)"/>
                </g>
                
                <g id="lily-bud">
                    <path d="M -15,0 C -25,-40 0,-80 0,-90 C 0,-80 25,-40 15,0 Z" fill="url(#bud-grad)"/>
                    <path d="M 0,0 Q -10,-40 0,-90" stroke="#8BC34A" stroke-width="1" fill="none"/>
                    <path d="M 0,0 Q 10,-40 0,-90" stroke="#8BC34A" stroke-width="1" fill="none"/>
                    <path d="M -15,0 Q 0,15 15,0 Q 0,25 -15,0 Z" fill="#4CAF50"/>
                </g>

                <g id="lily-leaf">
                    <path d="M 0,0 C 20,-30 15,-80 0,-110 C -15,-80 -20,-30 0,0 Z" fill="url(#leaf-grad)"/>
                    <path d="M 0,0 Q 0,-55 0,-110" stroke="#1B5E20" stroke-width="1.5" fill="none"/>
                </g>
              </defs>
              
              <g id="bouquet" transform="translate(0, 10)">
                  <!-- Stems -->
                  <path d="M 255,480 Q 350,250 380,150" stroke="#4CAF50" stroke-width="6" fill="none"/>
                  <path d="M 245,480 Q 150,250 130,120" stroke="#4CAF50" stroke-width="5" fill="none"/>
                  <path d="M 240,480 Q 180,350 130,250" stroke="#4CAF50" stroke-width="7" fill="none"/>
                  <path d="M 260,480 Q 320,350 370,260" stroke="#4CAF50" stroke-width="7" fill="none"/>
                  <path d="M 250,480 Q 250,300 250,220" stroke="#4CAF50" stroke-width="9" fill="none"/>
                  
                  <!-- Back Leaves -->
                  <use href="#lily-leaf" transform="translate(330, 260) rotate(45) scale(1.2)"/>
                  <use href="#lily-leaf" transform="translate(180, 270) rotate(-50) scale(1)"/>
                  
                  <!-- Buds -->
                  <use href="#lily-bud" transform="translate(380, 150) scale(0.8) rotate(30)"/>
                  <use href="#lily-bud" transform="translate(130, 120) scale(0.7) rotate(-40)"/>
                  
                  <!-- Mid Leaves -->
                  <use href="#lily-leaf" transform="translate(250, 350) rotate(-60) scale(1.3)"/>
                  <use href="#lily-leaf" transform="translate(260, 400) rotate(70) scale(1.5)"/>
                  <use href="#lily-leaf" transform="translate(200, 430) rotate(-40) scale(1.1)"/>
                  <use href="#lily-leaf" transform="translate(300, 320) rotate(50) scale(1.2)"/>
                  
                  <!-- Back Flowers -->
                  <use href="#lily-angled" transform="translate(130, 260) scale(0.9) rotate(-35)"/>
                  <use href="#lily-angled" transform="translate(370, 270) scale(0.95) rotate(35)"/>
                  
                  <!-- Front Center Flower -->
                  <use href="#lily-angled" transform="translate(250, 210) scale(1.2)"/>
                  
                  <!-- Foreground Leaves -->
                  <use href="#lily-leaf" transform="translate(250, 450) rotate(-30) scale(1.4)"/>
                  <use href="#lily-leaf" transform="translate(250, 480) rotate(40) scale(1.3)"/>
              </g>
            </svg>
            <div class="message">Para ti, Barby 💛</div>
        </div>
    </div>
    
    <script src="mibarbie.js"></script>
</body>
</html>
